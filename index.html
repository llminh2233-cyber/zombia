<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zombie FPS Survival - Sửa Lỗi Va Chạm & Multiplayer</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js & PointerLockControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
    <!-- PeerJS for Multiplayer -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; user-select: none; background-color: #050505; font-family: sans-serif; }
        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 20; }
        .damage-overlay { position: absolute; inset: 0; background: radial-gradient(circle, transparent 60%, rgba(220, 38, 38, 0.6) 100%); pointer-events: none; opacity: 0; transition: opacity 0.2s; z-index: 10; }
    </style>
</head>
<body class="bg-black text-white">

    <div id="game-container" class="w-full h-screen relative"></div>
    <div id="damage-flash" class="damage-overlay"></div>

    <!-- Crosshair -->
    <div id="crosshair">
        <div class="w-6 h-6 relative flex items-center justify-center">
            <div class="absolute w-2 h-0.5 bg-red-500"></div>
            <div class="absolute h-2 w-0.5 bg-red-500"></div>
            <div class="w-1 h-1 bg-red-400 rounded-full"></div>
        </div>
    </div>

    <!-- HUD -->
    <div id="hud" class="absolute inset-0 pointer-events-none p-6 flex flex-col justify-between z-10 hidden">
        <div class="flex justify-between items-start">
            <div class="space-y-3">
                <div class="bg-black/70 p-3 rounded-xl w-64 border border-red-900/50">
                    <div class="flex justify-between text-xs font-bold mb-1 text-red-400">
                        <span>MÁU</span><span id="hp-text">200 / 200</span>
                    </div>
                    <div class="w-full bg-zinc-800 h-3 rounded-full overflow-hidden">
                        <div id="hp-bar" class="bg-red-600 h-full w-full transition-all"></div>
                    </div>
                </div>
                <div class="flex gap-3">
                    <div class="bg-black/70 px-4 py-2 rounded-xl border border-yellow-600/40 text-yellow-400 font-bold">
                        🪙 <span id="gold-display">0</span> Vàng
                    </div>
                    <div class="bg-black/70 px-4 py-2 rounded-xl border border-red-600/40 text-red-400 font-bold">
                        💀 Đợt <span id="wave-display">1</span>
                    </div>
                </div>
            </div>
            <div class="pointer-events-auto">
                <button id="btn-open-shop" class="bg-yellow-500 hover:bg-yellow-400 text-black font-extrabold px-5 py-2.5 rounded-xl">🛒 CỬA HÀNG (P)</button>
            </div>
        </div>
        <div class="flex justify-between items-end">
            <div class="bg-black/70 p-4 rounded-xl border border-zinc-800">
                <div id="weapon-name" class="font-extrabold text-white">Súng Lục</div>
                <div id="weapon-type-badge" class="text-xs text-red-400">Căn Bản</div>
            </div>
            <div class="bg-black/70 px-6 py-3 rounded-xl border border-zinc-800 text-right">
                <div class="text-[10px] text-zinc-400 font-semibold">ĐẠN</div>
                <div class="text-3xl font-black"><span id="ammo-current" class="text-amber-400">12</span> / <span id="ammo-max" class="text-zinc-400">12</span></div>
            </div>
        </div>
    </div>

    <!-- Start Overlay -->
    <div id="start-overlay" class="absolute inset-0 bg-black/90 flex flex-col items-center justify-center z-30 p-4">
        <div class="max-w-md w-full bg-zinc-900 border border-zinc-800 rounded-2xl p-6 text-center space-y-4">
            <h1 class="text-3xl font-black text-red-600 uppercase">SỐNG CÒN ZOMBIE 3D</h1>
            
            <div class="text-left space-y-1">
                <label class="text-xs font-bold text-zinc-400">TÊN NHÂN VẬT:</label>
                <input id="player-name-input" type="text" value="Chiến Binh" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-2 text-sm text-yellow-400 font-bold">
            </div>

            <!-- Multiplayer Box -->
            <div class="bg-zinc-950 p-4 rounded-xl text-left border border-zinc-800 space-y-3">
                <div class="text-xs font-bold text-amber-400 uppercase">🌐 PHÒNG CHƠI CHUNG</div>
                <div class="flex gap-2">
                    <button id="btn-create-room" class="flex-1 bg-zinc-800 hover:bg-zinc-700 text-xs font-bold py-2 rounded-lg border border-zinc-700">Tạo Phòng</button>
                    <button id="btn-copy-code" class="hidden bg-amber-600 hover:bg-amber-500 text-black text-xs font-bold px-3 py-2 rounded-lg">Copy Mã</button>
                </div>
                <div id="room-status" class="text-xs text-zinc-400">Mã phòng của bạn: <span id="my-peer-id" class="text-yellow-400 font-mono font-bold">Chưa tạo</span></div>
                
                <div class="flex gap-2">
                    <input id="join-room-id" type="text" placeholder="Nhập mã 6 ký tự..." class="flex-1 bg-zinc-900 border border-zinc-800 rounded-lg px-3 py-1.5 text-xs text-zinc-200">
                    <button id="btn-join-room" class="bg-red-600 hover:bg-red-500 text-xs font-bold px-4 py-1.5 rounded-lg">Vào</button>
                </div>
            </div>

            <button id="btn-start" class="w-full bg-red-600 hover:bg-red-500 text-white font-extrabold py-3.5 rounded-xl uppercase">BẮT ĐẦU CHƠI SINGLEPLAYER</button>
        </div>
    </div>

    <!-- Shop Modal -->
    <div id="shop-modal" class="absolute inset-0 bg-black/80 z-40 flex items-center justify-center p-4 hidden">
        <div class="bg-zinc-900 border border-zinc-800 rounded-2xl max-w-2xl w-full p-6 space-y-4">
            <div class="flex justify-between items-center border-b border-zinc-800 pb-3">
                <h2 class="text-xl font-bold text-amber-500">🛒 CỬA HÀNG VŨ KHÍ & SKIN</h2>
                <div class="text-amber-400 font-bold">🪙 <span id="shop-gold-display">0</span> Vàng</div>
            </div>
            <div class="space-y-3 max-h-[60vh] overflow-y-auto" id="shop-content"></div>
            <button id="btn-close-shop" class="w-full bg-zinc-800 hover:bg-zinc-700 py-2 rounded-xl font-bold">ĐÓNG (P)</button>
        </div>
    </div>

    <script>
        class AudioFX {
            constructor() { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
            playShot() {
                if (this.ctx.state === 'suspended') this.ctx.resume();
                const now = this.ctx.currentTime, osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                osc.frequency.setValueAtTime(350, now); osc.frequency.exponentialRampToValueAtTime(50, now + 0.12);
                gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                osc.connect(gain); gain.connect(this.ctx.destination); osc.start(now); osc.stop(now + 0.12);
            }
            playHit() {
                if (this.ctx.state === 'suspended') this.ctx.resume();
                const now = this.ctx.currentTime, osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(100, now);
                gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.connect(gain); gain.connect(this.ctx.destination); osc.start(now); osc.stop(now + 0.1);
            }
        }
        const audio = new AudioFX();

        let isPlaying = false, isShopOpen = false;
        let mapScene, mapCamera, mapRenderer, mapControls;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        const velocity = new THREE.Vector3(), direction = new THREE.Vector3();

        const colliderBoxes = [];
        const MAP_LIMIT = 140;

        const player = { name: "Chiến Binh", hp: 200, maxHp: 200, gold: 0, damageMult: 1.0, currentSkin: 0x22c55e };
        const WEAPONS = {
            pistol: { name: 'Súng Lục', type: 'Căn Bản', damage: 25, fireRate: 350, clipSize: 12, currentAmmo: 12, unlocked: true, price: 0 },
            rifle: { name: 'Súng Bắn Nhanh', type: 'Liên Thanh', damage: 35, fireRate: 130, clipSize: 30, currentAmmo: 30, unlocked: false, price: 250 },
            sniper: { name: 'Súng Ngắm', type: 'Chí Mạng', damage: 180, fireRate: 1000, clipSize: 5, currentAmmo: 5, unlocked: false, price: 600 }
        };
        let currentWeaponKey = 'pistol', lastShotTime = 0;

        let currentWave = 1, zombiesAlive = [], particles = [];
        let peer = null, shortRoomCode = "";

        // --- HÀM TẠO MÃ PHÒNG NGẮN 6 KÝ TỰ ---
        function generateShortCode() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let res = '';
            for (let i = 0; i < 6; i++) res += chars.charAt(Math.floor(Math.random() * chars.length));
            return res;
        }

        function init3DMap() {
            mapScene = new THREE.Scene();
            mapScene.background = new THREE.Color(0x0a0a12);
            mapScene.fog = new THREE.FogExp2(0x0a0a12, 0.018);

            mapCamera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            mapCamera.position.set(0, 1.7, 0);

            mapRenderer = new THREE.WebGLRenderer({ antialias: true });
            mapRenderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('game-container').appendChild(mapRenderer.domElement);

            mapScene.add(new THREE.AmbientLight(0x555566));
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.7);
            dirLight.position.set(30, 50, 30);
            mapScene.add(dirLight);

            // Floor
            const floor = new THREE.Mesh(new THREE.PlaneGeometry(300, 300), new THREE.MeshStandardMaterial({ color: 0x1a1a20 }));
            floor.rotation.x = -Math.PI / 2;
            mapScene.add(floor);

            // Buildings & Colliders (SỬA LỖI XUYÊN TƯỜNG)
            const buildingMat = new THREE.MeshStandardMaterial({ color: 0x334155 });
            for (let i = 0; i < 30; i++) {
                const w = 10 + Math.random() * 8, h = 15 + Math.random() * 15, d = 10 + Math.random() * 8;
                const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), buildingMat);
                b.position.set((Math.random() - 0.5) * 220, h / 2, (Math.random() - 0.5) * 220);
                mapScene.add(b);

                // Tạo khung va chạm rộng hơn 1 chút để chống xuyên tường
                const box = new THREE.Box3().setFromObject(b);
                box.expandByScalar(0.4); 
                colliderBoxes.push(box);
            }

            mapControls = new THREE.PointerLockControls(mapCamera, document.body);

            document.addEventListener('keydown', (e) => {
                if (e.code === 'KeyW') moveForward = true;
                if (e.code === 'KeyS') moveBackward = true;
                if (e.code === 'KeyA') moveLeft = true;
                if (e.code === 'KeyD') moveRight = true;
                if (e.code === 'KeyP' && isPlaying) toggleShop();
            });

            document.addEventListener('keyup', (e) => {
                if (e.code === 'KeyW') moveForward = false;
                if (e.code === 'KeyS') moveBackward = false;
                if (e.code === 'KeyA') moveLeft = false;
                if (e.code === 'KeyD') moveRight = false;
            });

            window.addEventListener('mousedown', (e) => {
                if (e.button === 0 && isPlaying && !isShopOpen && mapControls.isLocked) shootWeapon();
            });

            animate();
        }

        // KIỂM TRA VA CHẠM TƯỜNG & BIÊN MAP
        function checkCollisions(pos) {
            if (Math.abs(pos.x) > MAP_LIMIT) pos.x = Math.sign(pos.x) * MAP_LIMIT;
            if (Math.abs(pos.z) > MAP_LIMIT) pos.z = Math.sign(pos.z) * MAP_LIMIT;

            const playerBox = new THREE.Box3().setFromCenterAndSize(pos, new THREE.Vector3(1.0, 1.8, 1.0));
            for (let box of colliderBoxes) {
                if (playerBox.intersectsBox(box)) return true;
            }
            return false;
        }

        let prevTime = performance.now();
        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now();
            const delta = (time - prevTime) / 1000;

            if (mapControls && mapControls.isLocked) {
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;
                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                if (moveForward || moveBackward) velocity.z -= direction.z * 90.0 * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * 90.0 * delta;

                const oldX = mapCamera.position.x;
                mapControls.moveRight(-velocity.x * delta);
                if (checkCollisions(mapCamera.position)) mapCamera.position.x = oldX;

                const oldZ = mapCamera.position.z;
                mapControls.moveForward(-velocity.z * delta);
                if (checkCollisions(mapCamera.position)) mapCamera.position.z = oldZ;
            }

            // Zombie Movement
            if (isPlaying && !isShopOpen) {
                for (let i = zombiesAlive.length - 1; i >= 0; i--) {
                    const z = zombiesAlive[i];
                    z.mesh.lookAt(mapCamera.position.x, z.mesh.position.y, mapCamera.position.z);
                    const dir = new THREE.Vector3().subVectors(mapCamera.position, z.mesh.position);
                    dir.y = 0;
                    if (dir.length() > 1.2) {
                        dir.normalize();
                        z.mesh.position.addScaledVector(dir, z.speed * delta);
                    } else if (time - z.lastAttackTime > 1000) {
                        z.lastAttackTime = time;
                        playerTakeDamage(z.damage);
                    }
                }

                // HẠT HIỆU ỨNG MÁU VĂNG (BLOOD PARTICLES)
                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.life -= delta * 3;
                    p.mesh.position.addScaledVector(p.vel, delta);
                    if (p.life <= 0) {
                        mapScene.remove(p.mesh);
                        particles.splice(i, 1);
                    }
                }
            }

            prevTime = time;
            mapRenderer.render(mapScene, mapCamera);
        }

        function spawnZombie() {
            if (!isPlaying || isShopOpen) return;
            const mesh = new THREE.Group();
            const body = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.3, 1.4), new THREE.MeshStandardMaterial({ color: 0x15803d }));
            body.position.y = 0.7; mesh.add(body);

            const angle = Math.random() * Math.PI * 2, dist = 25 + Math.random() * 10;
            mesh.position.set(mapCamera.position.x + Math.cos(angle) * dist, 0, mapCamera.position.z + Math.sin(angle) * dist);
            mapScene.add(mesh);
            zombiesAlive.push({ mesh, hp: 80, speed: 3.5, damage: 10, gold: 20, lastAttackTime: 0 });
        }

        function createBloodParticles(pos) {
            for (let i = 0; i < 8; i++) {
                const p = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.08, 0.08), new THREE.MeshBasicMaterial({ color: 0xb71c1c }));
                p.position.copy(pos);
                const vel = new THREE.Vector3((Math.random() - 0.5) * 3, Math.random() * 2 + 1, (Math.random() - 0.5) * 3);
                mapScene.add(p);
                particles.push({ mesh: p, vel, life: 1.0 });
            }
        }

        function shootWeapon() {
            const w = WEAPONS[currentWeaponKey];
            if (w.currentAmmo <= 0 || performance.now() - lastShotTime < w.fireRate) return;
            lastShotTime = performance.now();
            w.currentAmmo--; updateHUD(); audio.playShot();

            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0, 0), mapCamera);
            const intersects = raycaster.intersectObjects(zombiesAlive.map(z => z.mesh), true);

            if (intersects.length > 0) {
                let hitMesh = intersects[0].object;
                while (hitMesh.parent && hitMesh.parent.type !== 'Scene') hitMesh = hitMesh.parent;
                const zombie = zombiesAlive.find(z => z.mesh === hitMesh);
                if (zombie) {
                    zombie.hp -= w.damage;
                    audio.playHit();
                    createBloodParticles(intersects[0].point); // HIỆU ỨNG BẮN TRÚNG MỚI
                    if (zombie.hp <= 0) {
                        player.gold += zombie.gold;
                        mapScene.remove(zombie.mesh);
                        zombiesAlive = zombiesAlive.filter(z => z !== zombie);
                        updateHUD();
                    }
                }
            }
        }

        function playerTakeDamage(dmg) {
            player.hp = Math.max(0, player.hp - dmg);
            updateHUD();
            if (player.hp <= 0) { alert('BẠN ĐÃ THUA!'); location.reload(); }
        }

        function updateHUD() {
            const w = WEAPONS[currentWeaponKey];
            document.getElementById('hp-bar').style.width = `${(player.hp / player.maxHp) * 100}%`;
            document.getElementById('hp-text').textContent = `${player.hp} / ${player.maxHp}`;
            document.getElementById('gold-display').textContent = player.gold;
            document.getElementById('shop-gold-display').textContent = player.gold;
            document.getElementById('ammo-current').textContent = w.currentAmmo;
            document.getElementById('ammo-max').textContent = w.clipSize;
        }

        function toggleShop() {
            isShopOpen = !isShopOpen;
            document.getElementById('shop-modal').classList.toggle('hidden', !isShopOpen);
            if (isShopOpen) mapControls.unlock(); else if (isPlaying) mapControls.lock();
        }

        window.addEventListener('DOMContentLoaded', () => {
            init3DMap();

            document.getElementById('btn-start').addEventListener('click', () => {
                document.getElementById('start-overlay').style.display = 'none';
                document.getElementById('hud').classList.remove('hidden');
                isPlaying = true; mapControls.lock();
                setInterval(spawnZombie, 2000);
            });

            // TẠO PHÒNG VỚI MÃ NGẮN NGHỈNH 6 KÝ TỰ
            document.getElementById('btn-create-room').addEventListener('click', () => {
                shortRoomCode = generateShortCode();
                document.getElementById('my-peer-id').textContent = shortRoomCode;
                document.getElementById('btn-copy-code').classList.remove('hidden');
                alert(`Đã tạo phòng! Mã phòng của bạn là: ${shortRoomCode}`);
            });

            // NÚT COPY MÃ PHÒNG NHANH
            document.getElementById('btn-copy-code').addEventListener('click', () => {
                navigator.clipboard.writeText(shortRoomCode);
                alert(`Đã copy mã phòng (${shortRoomCode}) vào bộ nhớ tạm!`);
            });

            document.getElementById('btn-open-shop').addEventListener('click', toggleShop);
            document.getElementById('btn-close-shop').addEventListener('click', toggleShop);
        });
    </script>
</body>
</html>
